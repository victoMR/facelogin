name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Backend tests
        run: npm test -w backend

      - name: Frontend tests
        run: npm test -w frontend

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  human-acceptance:
    name: Human acceptance checklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify checklist is documented
        run: |
          test -f docs/aceptacion-humana.md
          grep -q "Entré solo con mi cara" docs/aceptacion-humana.md
          echo "Checklist presente — validación humana sigue siendo manual en demo/PR."
